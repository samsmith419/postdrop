<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PostDrop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#1a2744;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;touch-action:manipulation}
.screen{display:none;width:100%;max-width:400px;flex-direction:column;align-items:center;animation:fadeIn .4s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.lang-bar{position:fixed;top:14px;right:14px;display:flex;gap:6px;z-index:99}
.lb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.lb.on{background:#FF6600;border-color:#FF6600}

/* Landing */
.tagline{font-family:'Playfair Display',serif;color:#fff;font-size:24px;text-align:center;margin-bottom:8px;line-height:1.3}
.sub{color:#a0b0cc;font-size:13px;text-align:center;margin-bottom:36px}
.mailbox-svg{width:170px;height:220px;margin-bottom:36px;filter:drop-shadow(0 10px 28px rgba(255,102,0,.35))}
.btn{background:#FF6600;color:#fff;border:none;border-radius:50px;padding:15px 32px;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;width:100%;margin-top:10px}
.btn:hover{background:#e05500;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:2px solid #FF6600;color:#FF6600}
.btn-ghost:hover{background:rgba(255,102,0,.1)}

/* Editor */
#screen-editor{gap:14px}
.editor-title{font-family:'Playfair Display',serif;color:#fff;font-size:20px;text-align:center}
.pc-tabs{display:flex;width:100%;border-radius:12px 12px 0 0;overflow:hidden}
.pc-tab{flex:1;padding:9px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border:none;transition:all .2s}
.pc-tab.on{background:#fdf6e3;color:#333}
.pc-body{width:100%;background:#fdf6e3;border-radius:0 0 12px 12px;box-shadow:0 8px 28px rgba(0,0,0,.4);overflow:hidden}
.pc-photo{display:flex;align-items:center;justify-content:center;height:190px;cursor:pointer;position:relative;background:linear-gradient(135deg,#667eea,#764ba2);overflow:hidden}
.pc-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pc-photo-hint{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;opacity:.85;pointer-events:none;position:relative;z-index:1}
.pc-photo-hint span:first-child{font-size:36px}
.pc-photo-hint span:last-child{font-size:12px;font-weight:600}
.pc-retake{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;z-index:2;display:none}
.pc-photo:hover .pc-retake,.pc-photo:focus-within .pc-retake{display:block}
.pc-write{display:flex;height:190px;position:relative}
.pc-stripe{width:5px;background:repeating-linear-gradient(to bottom,#FF6600 0,#FF6600 18px,#fff 18px,#fff 22px);flex-shrink:0}
.pc-content{flex:1;padding:10px 12px;display:flex;flex-direction:column;position:relative}
.pc-stamp{position:absolute;top:8px;right:8px;width:36px;height:46px;border:2px solid #999;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:#fff}
.pc-stamp small{font-size:6px;color:#888;margin-top:1px}
.pc-content textarea{flex:1;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:12px;color:#333;resize:none;outline:none;line-height:1.85;padding-right:46px;background-image:repeating-linear-gradient(transparent,transparent 24px,#e0d8c8 24px,#e0d8c8 25px);background-size:100% 25px}
.pc-counter{text-align:right;font-size:10px;color:#aaa;margin-top:2px}
.pc-to{border-top:1px solid #ddd;padding-top:5px;display:flex;flex-direction:column;gap:3px}
.pc-to input{border:none;background:transparent;font-size:11px;color:#444;outline:none;padding:2px 0;border-bottom:1px dashed #ccc}
.pc-to input::placeholder{color:#bbb}
#photoInput{display:none}

/* ═══ DROP SCREEN ═══ */
#screen-drop{
  position:fixed;inset:0;background:#1a2744;
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:30px 24px 40px;
  z-index:50;
  display:none;
}
#screen-drop.active{display:flex}

.drop-hint{color:rgba(255,255,255,.5);font-size:13px;text-align:center;transition:opacity .3s}

/* Draggable postcard */
.drag-card{
  width:260px;height:150px;
  background:#fdf6e3;border-radius:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  position:relative;
  cursor:grab;
  touch-action:none;
  user-select:none;
  display:flex;overflow:hidden;
  transition:box-shadow .2s;
  z-index:10;
}
.drag-card:active{cursor:grabbing;box-shadow:0 16px 48px rgba(0,0,0,.7)}
.drag-card.dragging{transition:none}
.drag-card .card-photo{width:45%;background:linear-gradient(135deg,#667eea,#764ba2);position:relative;overflow:hidden;flex-shrink:0}
.drag-card .card-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.drag-card .card-photo .no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.6}
.drag-card .card-right{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:4px;position:relative}
.drag-card .card-stamp{position:absolute;top:6px;right:6px;width:26px;height:32px;border:1.5px solid #999;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.drag-card .card-lines{flex:1;background-image:repeating-linear-gradient(transparent,transparent 14px,#e0d8c8 14px,#e0d8c8 15px);background-size:100% 15px;margin-top:2px}
.drag-card .card-addr{border-top:1px solid #ddd;padding-top:3px;font-size:9px;color:#aaa}

/* Mailbox drop zone */
.drop-mailbox{
  width:160px;height:200px;
  position:relative;
  transition:filter .3s;
}
.drop-mailbox.glow{filter:drop-shadow(0 0 20px rgba(255,102,0,.8))}
.drop-mailbox svg{width:100%;height:100%}
.slot-zone{
  position:absolute;top:45%;left:50%;transform:translateX(-50%);
  width:100px;height:20px;
  /* debug: uncomment to see zone */
  /* background:rgba(255,0,0,.3); */
}

/* Done */
#screen-done{gap:18px;text-align:center}
.done-icon{font-size:64px;animation:pop .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.done-title{font-family:'Playfair Display',serif;color:#fff;font-size:24px}
.done-sub{color:#a0b0cc;font-size:14px;line-height:1.6}
.info-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:18px 20px;width:100%;display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
.info-row .ico{font-size:20px}
.info-label{color:#a0b0cc;font-size:11px}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lb on" onclick="setLang('en')">EN</button>
  <button class="lb" onclick="setLang('zh')">中文</button>
</div>
<input type="file" id="photoInput" accept="image/*">

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <h1 class="tagline" data-t="tagline"></h1>
  <p class="sub" data-t="sub"></p>
  <svg class="mailbox-svg" viewBox="0 0 200 260" fill="none">
    <rect x="88" y="200" width="24" height="56" rx="4" fill="#cc4400"/>
    <rect x="20" y="80" width="160" height="130" rx="14" fill="#FF6600"/>
    <ellipse cx="100" cy="80" rx="80" ry="20" fill="#e55500"/>
    <rect x="35" y="100" width="130" height="90" rx="8" fill="#e55500"/>
    <rect x="50" y="125" width="100" height="12" rx="6" fill="#1a1a1a"/>
    <rect x="45" y="150" width="110" height="24" rx="4" fill="#fff" opacity=".15"/>
    <text x="100" y="166" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1">ČESKÁ POŠTA</text>
    <circle cx="45" cy="110" r="4" fill="#cc4400"/>
    <circle cx="155" cy="110" r="4" fill="#cc4400"/>
    <rect x="88" y="185" width="24" height="14" rx="4" fill="#cc4400"/>
    <circle cx="100" cy="185" r="5" fill="#e55500"/>
    <rect x="50" y="118" width="100" height="10" rx="5" fill="#cc4400"/>
    <ellipse cx="70" cy="95" rx="20" ry="6" fill="#fff" opacity=".1" transform="rotate(-20 70 95)"/>
  </svg>
  <button class="btn" onclick="go('screen-editor')" data-t="btnWrite"></button>
</div>

<!-- EDITOR -->
<div id="screen-editor" class="screen">
  <h2 class="editor-title" data-t="editorTitle"></h2>
  <div style="width:100%">
    <div class="pc-tabs">
      <button class="pc-tab on" id="tab-photo" onclick="showSide('photo')" data-t="tabPhoto"></button>
      <button class="pc-tab" id="tab-write" onclick="showSide('write')" data-t="tabWrite"></button>
    </div>
    <div class="pc-body">
      <div class="pc-photo" id="side-photo" onclick="document.getElementById('photoInput').click()">
        <img id="uploadedImg" style="display:none" alt="">
        <div class="pc-photo-hint" id="photoHint"><span>📷</span><span data-t="photoLabel"></span></div>
        <button class="pc-retake" data-t="retake" onclick="event.stopPropagation();document.getElementById('photoInput').click()"></button>
      </div>
      <div class="pc-write" id="side-write" style="display:none">
        <div class="pc-stripe"></div>
        <div class="pc-content">
          <div class="pc-stamp">🇨🇿<small>CZ</small></div>
          <textarea id="msgArea" maxlength="150" data-t-ph="msgPh"></textarea>
          <div class="pc-counter"><span id="cc">0</span>/150</div>
          <div class="pc-to">
            <input id="toName" data-t-ph="toName">
            <input id="toCity" data-t-ph="toCity">
          </div>
        </div>
      </div>
    </div>
  </div>
  <button class="btn" onclick="openDrop()" data-t="btnDrop"></button>
  <button class="btn btn-ghost" onclick="go('screen-landing')" data-t="btnBack"></button>
</div>

<!-- DROP SCREEN (fullscreen) -->
<div id="screen-drop" class="screen">
  <p class="drop-hint" id="dropHint" data-t="dropHint"></p>

  <div class="drag-card" id="dragCard">
    <div class="card-photo">
      <img id="dragImg" style="display:none" alt="">
      <div class="card-photo .no-photo" id="dragNoPhoto">📷</div>
    </div>
    <div class="card-right">
      <div class="card-stamp">🇨🇿</div>
      <div class="card-lines"></div>
      <div class="card-addr" id="cardAddr"></div>
    </div>
  </div>

  <div class="drop-mailbox" id="dropMailbox">
    <svg viewBox="0 0 200 260" fill="none">
      <rect x="88" y="200" width="24" height="56" rx="4" fill="#cc4400"/>
      <rect x="20" y="80" width="160" height="130" rx="14" fill="#FF6600"/>
      <ellipse cx="100" cy="80" rx="80" ry="20" fill="#e55500"/>
      <rect x="35" y="100" width="130" height="90" rx="8" fill="#e55500"/>
      <rect x="50" y="125" width="100" height="12" rx="6" fill="#1a1a1a"/>
      <rect x="45" y="150" width="110" height="24" rx="4" fill="#fff" opacity=".15"/>
      <text x="100" y="166" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1">ČESKÁ POŠTA</text>
      <circle cx="45" cy="110" r="4" fill="#cc4400"/>
      <circle cx="155" cy="110" r="4" fill="#cc4400"/>
      <rect x="88" y="185" width="24" height="14" rx="4" fill="#cc4400"/>
      <circle cx="100" cy="185" r="5" fill="#e55500"/>
      <rect id="dropFlap" x="50" y="118" width="100" height="10" rx="5" fill="#cc4400" style="transform-origin:100px 118px;transition:transform .2s"/>
      <ellipse cx="70" cy="95" rx="20" ry="6" fill="#fff" opacity=".1" transform="rotate(-20 70 95)"/>
    </svg>
    <div class="slot-zone" id="slotZone"></div>
  </div>
</div>

<!-- DONE -->
<div id="screen-done" class="screen">
  <div class="done-icon">🎉</div>
  <h2 class="done-title" data-t="doneTitle"></h2>
  <p class="done-sub" data-t="doneSub"></p>
  <div class="info-card">
    <div class="info-row"><span class="ico">📍</span><div><div data-t="sentFrom"></div><div class="info-label" data-t="sentFromSub"></div></div></div>
    <div class="info-row"><span class="ico">📅</span><div><div data-t="eta"></div><div class="info-label" data-t="etaSub"></div></div></div>
    <div class="info-row"><span class="ico">🟠</span><div><div data-t="proc"></div><div class="info-label" data-t="procSub"></div></div></div>
  </div>
  <button class="btn" onclick="reset()" data-t="btnAgain"></button>
</div>

<script>
const T={
  en:{
    tagline:'Send a postcard<br>from anywhere 🌍',
    sub:"Snap a photo, write a few words. We'll mail a real postcard.",
    btnWrite:'✉️  Write a Postcard',
    editorTitle:'Your Postcard',
    tabPhoto:'🖼  Photo',tabWrite:'✏️  Write',
    photoLabel:'Tap to add photo',retake:'📷 Change',
    msgPh:"Hey! I'm here thinking of you...",
    toName:'Recipient name',toCity:'City, Country',
    btnDrop:'📮  Drop into mailbox →',
    btnBack:'← Back',
    dropHint:'Drag the postcard into the mailbox',
    dropNear:'Let go to send! 📮',
    doneTitle:'Postcard Sent!',
    doneSub:'Your postcard is on its way!',
    sentFrom:'Sent from Prague',sentFromSub:'Czech Republic',
    eta:'Estimated delivery: 5–7 days',etaSub:'International delivery',
    proc:'Processed by Česká pošta',procSub:'Tracking coming soon',
    btnAgain:'✉️  Send Another',
  },
  zh:{
    tagline:'從任何地方<br>寄出一張明信片 🌍',
    sub:'拍一張照、寫幾行字，我們幫你寄出真實的明信片。',
    btnWrite:'✉️  寫一張明信片',
    editorTitle:'你的明信片',
    tabPhoto:'🖼  照片',tabWrite:'✏️  寫字',
    photoLabel:'點擊新增照片',retake:'📷 更換',
    msgPh:'嗨！我在這裡，想著你...',
    toName:'收件人姓名',toCity:'城市，國家',
    btnDrop:'📮  投入郵筒 →',
    btnBack:'← 返回',
    dropHint:'把明信片拖進郵筒裡',
    dropNear:'放手寄出！📮',
    doneTitle:'明信片已寄出！',
    doneSub:'你的明信片正在路上！',
    sentFrom:'從布拉格寄出',sentFromSub:'捷克共和國',
    eta:'預估送達：5–7 天',etaSub:'國際郵寄',
    proc:'由 Česká pošta 處理',procSub:'追蹤功能即將推出',
    btnAgain:'✉️  再寄一張',
  }
};
let lang='en', photoData=null;

function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文')));
  document.querySelectorAll('[data-t]').forEach(el=>{const v=T[l][el.dataset.t];if(v!==undefined)el.innerHTML=v;});
  document.querySelectorAll('[data-t-ph]').forEach(el=>{const v=T[l][el.dataset.tPh];if(v!==undefined)el.placeholder=v;});
}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showSide(s){
  document.getElementById('side-photo').style.display=s==='photo'?'flex':'none';
  document.getElementById('side-write').style.display=s==='write'?'flex':'none';
  document.getElementById('tab-photo').classList.toggle('on',s==='photo');
  document.getElementById('tab-write').classList.toggle('on',s==='write');
}
document.getElementById('photoInput').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    photoData=e.target.result;
    document.getElementById('uploadedImg').src=photoData;
    document.getElementById('uploadedImg').style.display='block';
    document.getElementById('photoHint').style.display='none';
    setTimeout(()=>showSide('write'),300);
  };
  r.readAsDataURL(f);
});
document.getElementById('msgArea').addEventListener('input',function(){document.getElementById('cc').textContent=this.value.length;});

function openDrop(){
  // Populate drag card preview
  const di=document.getElementById('dragImg'),dn=document.getElementById('dragNoPhoto');
  if(photoData){di.src=photoData;di.style.display='block';dn.style.display='none';}
  else{di.style.display='none';dn.style.display='flex';}
  const addr=document.getElementById('toName').value||'';
  document.getElementById('cardAddr').textContent=addr;
  go('screen-drop');
  initDrag();
}

// ── DRAG LOGIC ──
function initDrag(){
  const card=document.getElementById('dragCard');
  const mailbox=document.getElementById('dropMailbox');
  const flap=document.getElementById('dropFlap');
  const hint=document.getElementById('dropHint');

  // Reset position
  card.style.transform='';
  card.style.transition='';
  card.classList.remove('dragging');
  flap.style.transform='';
  mailbox.classList.remove('glow');

  let startX=0,startY=0,curX=0,curY=0,isDragging=false,dropped=false;

  function getSlotRect(){return document.getElementById('slotZone').getBoundingClientRect();}
  function getCardRect(){return card.getBoundingClientRect();}

  function isNearSlot(){
    const sr=getSlotRect(),cr=getCardRect();
    const cx=cr.left+cr.width/2, cy=cr.top+cr.height/2;
    return cy > sr.top-40 && cy < sr.bottom+60 && cx > sr.left-60 && cx < sr.right+60;
  }

  function onStart(e){
    if(dropped)return;
    isDragging=true;
    card.classList.add('dragging');
    const pt=e.touches?e.touches[0]:e;
    const rect=card.getBoundingClientRect();
    startX=pt.clientX-rect.left-rect.width/2;
    startY=pt.clientY-rect.top-rect.height/2;
    e.preventDefault();
  }
  function onMove(e){
    if(!isDragging||dropped)return;
    e.preventDefault();
    const pt=e.touches?e.touches[0]:e;
    curX=pt.clientX-startX;curY=pt.clientY-startY;

    // Get card's original centered position
    const orig=card.getBoundingClientRect();
    const ox=window.innerWidth/2;
    const oy=orig.top+orig.height/2; // approximate original center

    card.style.position='fixed';
    card.style.left=(curX-card.offsetWidth/2)+'px';
    card.style.top=(curY-card.offsetHeight/2)+'px';
    card.style.margin='0';

    const near=isNearSlot();
    mailbox.classList.toggle('glow',near);
    flap.style.transform=near?'scaleY(0.2)':'';
    hint.innerHTML=near?T[lang].dropNear:T[lang].dropHint;
  }
  function onEnd(e){
    if(!isDragging||dropped)return;
    isDragging=false;
    card.classList.remove('dragging');
    if(isNearSlot()){
      dropped=true;
      dropCard();
    } else {
      // Snap back
      card.style.transition='all .4s cubic-bezier(.175,.885,.32,1.275)';
      card.style.position='';
      card.style.left='';card.style.top='';card.style.margin='';
      setTimeout(()=>{card.style.transition='';},400);
      flap.style.transform='';
      mailbox.classList.remove('glow');
      hint.innerHTML=T[lang].dropHint;
    }
  }

  function dropCard(){
    // Animate into slot
    const sr=getSlotRect();
    card.style.transition='all .5s cubic-bezier(.4,0,.8,.6)';
    card.style.left=(sr.left+sr.width/2-card.offsetWidth/2)+'px';
    card.style.top=(sr.top-card.offsetHeight/2)+'px';
    card.style.transform='scale(0.15) rotate(-5deg)';
    card.style.opacity='0';
    flap.style.transform='scaleY(1)';
    // Haptic
    if(navigator.vibrate) navigator.vibrate([30,20,60]);
    // Thunk mailbox
    setTimeout(()=>{
      mailbox.style.animation='none';
      mailbox.style.transform='translateX(-3px)';
      setTimeout(()=>{mailbox.style.transform='translateX(3px)';},60);
      setTimeout(()=>{mailbox.style.transform='translateX(-2px)';},120);
      setTimeout(()=>{mailbox.style.transform='';},180);
    },400);
    setTimeout(()=>{
      card.style.display='none';
      go('screen-done');
    },900);
  }

  card.addEventListener('mousedown',onStart);
  card.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchend',onEnd);
}

function reset(){
  document.getElementById('msgArea').value='';
  document.getElementById('cc').textContent='0';
  document.getElementById('toName').value='';
  document.getElementById('toCity').value='';
  document.getElementById('uploadedImg').style.display='none';
  document.getElementById('uploadedImg').src='';
  document.getElementById('photoHint').style.display='flex';
  document.getElementById('photoInput').value='';
  photoData=null;
  showSide('photo');
  // Reset drag card
  const card=document.getElementById('dragCard');
  card.style.cssText='';
  card.style.display='';
  go('screen-editor');
}
setLang('en');
</script>
</body>
</html>
