<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PostDrop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#1a2744;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;touch-action:manipulation}
.screen{display:none;width:100%;max-width:400px;flex-direction:column;align-items:center;animation:fadeIn .4s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.lang-bar{position:fixed;top:14px;right:14px;display:flex;gap:6px;z-index:99}
.lb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.lb.on{background:#FF6600;border-color:#FF6600}

/* Landing */
.tagline{font-family:'Playfair Display',serif;color:#fff;font-size:24px;text-align:center;margin-bottom:8px;line-height:1.3}
.sub{color:#a0b0cc;font-size:13px;text-align:center;margin-bottom:36px}
.mailbox-svg{width:170px;height:220px;margin-bottom:36px;filter:drop-shadow(0 10px 28px rgba(255,102,0,.35))}
.btn{background:#FF6600;color:#fff;border:none;border-radius:50px;padding:15px 32px;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;width:100%;margin-top:10px}
.btn:hover{background:#e05500;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:2px solid #FF6600;color:#FF6600}
.btn-ghost:hover{background:rgba(255,102,0,.1)}

/* ── POSTCARD FLIP — JS scaleX approach (works on all mobile browsers) ── */
#screen-editor{gap:14px}
.editor-title{font-family:'Playfair Display',serif;color:#fff;font-size:20px;text-align:center}

.pc-scene{width:100%;position:relative;}

/* Both faces stacked, only one visible at a time */
.pc-face{
  width:100%;border-radius:12px;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  backface-visibility:visible;
}
.pc-face.hidden{display:none}

/* scaleX flip animation */
@keyframes flipOut{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes flipIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pc-face.flip-out{animation:flipOut .18s ease-in forwards}
.pc-face.flip-in{animation:flipIn .18s ease-out forwards}

/* Front — photo */
.pc-front{
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;height:210px;
}
.pc-front img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-photo-hint{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;opacity:.85;pointer-events:none;position:relative;z-index:1}
.pc-photo-hint .cam{font-size:38px}
.pc-photo-hint .lbl{font-size:12px;font-weight:600}
.pc-retake{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;z-index:2;opacity:0;transition:opacity .2s}
.pc-front:hover .pc-retake,.pc-front:focus-within .pc-retake{opacity:1}

/* Back — writing */
.pc-back{background:#fdf6e3;display:flex;}
.pc-stripe{width:5px;flex-shrink:0;background:repeating-linear-gradient(to bottom,#FF6600 0,#FF6600 18px,#fff 18px,#fff 22px)}
.pc-content{flex:1;padding:10px 12px;display:flex;flex-direction:column;position:relative}
.pc-stamp{position:absolute;top:8px;right:8px;width:36px;height:46px;border:2px solid #999;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:#fff}
.pc-stamp small{font-size:6px;color:#888;margin-top:1px}
.pc-content textarea{
  flex:1;min-height:90px;border:none;background:transparent;
  font-family:'Lato',sans-serif;font-size:12px;color:#333;
  resize:none;outline:none;line-height:1.85;padding-right:46px;
  background-image:repeating-linear-gradient(transparent,transparent 24px,#e0d8c8 24px,#e0d8c8 25px);
  background-size:100% 25px;
}
.pc-counter{text-align:right;font-size:10px;color:#aaa;margin-top:2px}
.pc-to{border-top:1px solid #ddd;padding-top:5px;display:flex;flex-direction:column;gap:3px}
.pc-to input{border:none;background:transparent;font-size:11px;color:#444;outline:none;padding:2px 0;border-bottom:1px dashed #ccc}
.pc-to input::placeholder{color:#bbb}

.flip-pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.65);border-radius:20px;padding:6px 16px;
  font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;
  white-space:nowrap;align-self:center;
}
.flip-pill:hover{background:rgba(255,255,255,.15);color:#fff}

#photoInput{display:none}

/* ── DROP SCREEN ── */
#screen-drop{
  position:fixed;inset:0;background:#1a2744;
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:30px 24px 40px; z-index:50; display:none;
}
#screen-drop.active{display:flex}
.drop-hint{color:rgba(255,255,255,.55);font-size:13px;text-align:center;transition:color .3s}
.drop-hint.near{color:#FF6600;font-weight:700}
.drag-card{
  width:260px;height:150px;background:#fdf6e3;border-radius:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:flex;overflow:hidden;cursor:grab;
  touch-action:none;user-select:none;
  transition:box-shadow .2s;
}
.drag-card:active,.drag-card.dragging{cursor:grabbing;box-shadow:0 16px 48px rgba(0,0,0,.7)}
.dc-photo{width:45%;position:relative;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#667eea,#764ba2)}
.dc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dc-photo .no-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.6}
.dc-right{flex:1;padding:8px 10px;display:flex;flex-direction:column;position:relative}
.dc-stamp{position:absolute;top:6px;right:6px;width:26px;height:32px;border:1.5px solid #999;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.dc-lines{flex:1;background-image:repeating-linear-gradient(transparent,transparent 14px,#e0d8c8 14px,#e0d8c8 15px);background-size:100% 15px}
.dc-addr{font-size:9px;color:#aaa;padding-top:3px;border-top:1px solid #ddd}
.drop-box{width:170px;height:220px;position:relative;transition:filter .25s}
.drop-box.glow{filter:drop-shadow(0 0 18px rgba(255,102,0,.9))}
.drop-box svg{width:100%;height:100%}
.slot-hit{position:absolute;top:44%;left:50%;transform:translateX(-50%);width:110px;height:30px}

/* Done */
#screen-done{gap:18px;text-align:center}
.done-icon{font-size:64px;animation:pop .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.done-title{font-family:'Playfair Display',serif;color:#fff;font-size:24px}
.done-sub{color:#a0b0cc;font-size:14px;line-height:1.6}
.info-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:18px 20px;width:100%;display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
.ico{font-size:20px}.info-label{color:#a0b0cc;font-size:11px}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lb on" onclick="setLang('en')">EN</button>
  <button class="lb" onclick="setLang('zh')">中文</button>
</div>
<input type="file" id="photoInput" accept="image/*">

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <h1 class="tagline" data-t="tagline"></h1>
  <p class="sub" data-t="sub"></p>
  <svg class="mailbox-svg" viewBox="0 0 200 260" fill="none">
    <rect x="88" y="200" width="24" height="56" rx="4" fill="#cc4400"/>
    <rect x="20" y="80" width="160" height="130" rx="14" fill="#FF6600"/>
    <ellipse cx="100" cy="80" rx="80" ry="20" fill="#e55500"/>
    <rect x="35" y="100" width="130" height="90" rx="8" fill="#e55500"/>
    <rect x="50" y="125" width="100" height="12" rx="6" fill="#1a1a1a"/>
    <rect x="45" y="150" width="110" height="24" rx="4" fill="#fff" opacity=".15"/>
    <text x="100" y="166" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1">ČESKÁ POŠTA</text>
    <circle cx="45" cy="110" r="4" fill="#cc4400"/>
    <circle cx="155" cy="110" r="4" fill="#cc4400"/>
    <rect x="88" y="185" width="24" height="14" rx="4" fill="#cc4400"/>
    <circle cx="100" cy="185" r="5" fill="#e55500"/>
    <rect x="50" y="118" width="100" height="10" rx="5" fill="#cc4400"/>
    <ellipse cx="70" cy="95" rx="20" ry="6" fill="#fff" opacity=".1" transform="rotate(-20 70 95)"/>
  </svg>
  <button class="btn" onclick="go('screen-editor')" data-t="btnWrite"></button>
</div>

<!-- EDITOR -->
<div id="screen-editor" class="screen">
  <h2 class="editor-title" data-t="editorTitle"></h2>

  <!-- Postcard with scaleX flip -->
  <div class="pc-scene" id="pcScene">
    <!-- FRONT -->
    <div class="pc-face pc-front" id="pcFront" onclick="handlePhotoClick()">
      <img class="photo" id="uploadedImg" style="display:none" alt="">
      <div class="pc-photo-hint" id="photoHint">
        <span class="cam">📷</span>
        <span class="lbl" data-t="photoLabel"></span>
      </div>
      <button class="pc-retake" data-t="retake"
        onclick="event.stopPropagation();document.getElementById('photoInput').click()"></button>
    </div>
    <!-- BACK -->
    <div class="pc-face pc-back hidden" id="pcBack">
      <div class="pc-stripe"></div>
      <div class="pc-content">
        <div class="pc-stamp">🇨🇿<small>CZ</small></div>
        <textarea id="msgArea" maxlength="150" data-t-ph="msgPh"></textarea>
        <div class="pc-counter"><span id="cc">0</span>/150</div>
        <div class="pc-to">
          <input id="toName" data-t-ph="toName">
          <input id="toCity" data-t-ph="toCity">
        </div>
      </div>
    </div>
  </div>

  <!-- Flip button OUTSIDE the scene -->
  <button class="flip-pill" id="flipPill" onclick="flipCard()" data-t="flipToBack"></button>

  <button class="btn" onclick="openDrop()" style="margin-top:18px" data-t="btnDrop"></button>
  <button class="btn btn-ghost" onclick="go('screen-landing')" data-t="btnBack"></button>
</div>

<!-- DROP SCREEN -->
<div id="screen-drop" class="screen">
  <p class="drop-hint" id="dropHint" data-t="dropHint"></p>
  <div class="drag-card" id="dragCard">
    <div class="dc-photo">
      <img id="dragImg" style="display:none" alt="">
      <div class="no-ph" id="dragNoPhoto">📷</div>
    </div>
    <div class="dc-right">
      <div class="dc-stamp">🇨🇿</div>
      <div class="dc-lines"></div>
      <div class="dc-addr" id="cardAddr"></div>
    </div>
  </div>
  <div class="drop-box" id="dropBox">
    <svg viewBox="0 0 200 260" fill="none">
      <rect x="88" y="200" width="24" height="56" rx="4" fill="#cc4400"/>
      <rect x="20" y="80" width="160" height="130" rx="14" fill="#FF6600"/>
      <ellipse cx="100" cy="80" rx="80" ry="20" fill="#e55500"/>
      <rect x="35" y="100" width="130" height="90" rx="8" fill="#e55500"/>
      <rect x="50" y="125" width="100" height="12" rx="6" fill="#1a1a1a"/>
      <rect x="45" y="150" width="110" height="24" rx="4" fill="#fff" opacity=".15"/>
      <text x="100" y="166" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1">ČESKÁ POŠTA</text>
      <circle cx="45" cy="110" r="4" fill="#cc4400"/>
      <circle cx="155" cy="110" r="4" fill="#cc4400"/>
      <rect x="88" y="185" width="24" height="14" rx="4" fill="#cc4400"/>
      <circle cx="100" cy="185" r="5" fill="#e55500"/>
      <rect id="dropFlap" x="50" y="118" width="100" height="10" rx="5" fill="#cc4400"
        style="transform-origin:100px 118px;transition:transform .2s"/>
      <ellipse cx="70" cy="95" rx="20" ry="6" fill="#fff" opacity=".1" transform="rotate(-20 70 95)"/>
    </svg>
    <div class="slot-hit" id="slotHit"></div>
  </div>
</div>

<!-- DONE -->
<div id="screen-done" class="screen">
  <div class="done-icon">🎉</div>
  <h2 class="done-title" data-t="doneTitle"></h2>
  <p class="done-sub" data-t="doneSub"></p>
  <div class="info-card">
    <div class="info-row"><span class="ico">📍</span><div><div data-t="sentFrom"></div><div class="info-label" data-t="sentFromSub"></div></div></div>
    <div class="info-row"><span class="ico">📅</span><div><div data-t="eta"></div><div class="info-label" data-t="etaSub"></div></div></div>
    <div class="info-row"><span class="ico">🟠</span><div><div data-t="proc"></div><div class="info-label" data-t="procSub"></div></div></div>
  </div>
  <button class="btn" onclick="reset()" data-t="btnAgain"></button>
</div>

<script>
const T={
  en:{
    tagline:'Send a postcard<br>from anywhere 🌍',
    sub:"Snap a photo, write a few words. We'll mail a real postcard.",
    btnWrite:'✉️  Write a Postcard',
    editorTitle:'Your Postcard',
    photoLabel:'Tap to add your photo',
    retake:'📷 Change',
    msgPh:"Hey! I'm here thinking of you...",
    toName:'Recipient name',toCity:'City, Country',
    flipToBack:'✏️  Write message →',
    flipToFront:'🖼  View photo ←',
    btnDrop:'📮  Drop into mailbox →',
    btnBack:'← Back',
    dropHint:'Drag the postcard into the mailbox slot',
    dropNear:'Release to send! 📮',
    doneTitle:'Postcard Sent!',
    doneSub:'Your postcard is on its way!',
    sentFrom:'Sent from Prague',sentFromSub:'Czech Republic',
    eta:'Estimated delivery: 5–7 days',etaSub:'International delivery',
    proc:'Processed by Česká pošta',procSub:'Tracking coming soon',
    btnAgain:'✉️  Send Another',
  },
  zh:{
    tagline:'從任何地方<br>寄出一張明信片 🌍',
    sub:'拍一張照、寫幾行字，我們幫你寄出真實的明信片。',
    btnWrite:'✉️  寫一張明信片',
    editorTitle:'你的明信片',
    photoLabel:'點擊新增照片',retake:'📷 更換',
    msgPh:'嗨！我在這裡，想著你...',
    toName:'收件人姓名',toCity:'城市，國家',
    flipToBack:'✏️  寫訊息 →',
    flipToFront:'🖼  看照片 ←',
    btnDrop:'📮  投入郵筒 →',
    btnBack:'← 返回',
    dropHint:'把明信片拖進郵筒裡',
    dropNear:'放手寄出！📮',
    doneTitle:'明信片已寄出！',
    doneSub:'你的明信片正在路上！',
    sentFrom:'從布拉格寄出',sentFromSub:'捷克共和國',
    eta:'預估送達：5–7 天',etaSub:'國際郵寄',
    proc:'由 Česká pošta 處理',procSub:'追蹤功能即將推出',
    btnAgain:'✉️  再寄一張',
  }
};

let lang='en', isFlipped=false, photoData=null;

function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文')));
  document.querySelectorAll('[data-t]').forEach(el=>{const v=T[l][el.dataset.t];if(v!==undefined)el.innerHTML=v;});
  document.querySelectorAll('[data-t-ph]').forEach(el=>{const v=T[l][el.dataset.tPh];if(v!==undefined)el.placeholder=v;});
  updatePill();
}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function updatePill(){
  document.getElementById('flipPill').textContent=T[lang][isFlipped?'flipToFront':'flipToBack'];
}
function flipCard(){
  const front=document.getElementById('pcFront'),back=document.getElementById('pcBack');
  const outEl=isFlipped?back:front, inEl=isFlipped?front:back;
  outEl.classList.add('flip-out');
  setTimeout(()=>{
    outEl.classList.remove('flip-out');outEl.classList.add('hidden');
    inEl.classList.remove('hidden');inEl.classList.add('flip-in');
    setTimeout(()=>inEl.classList.remove('flip-in'),200);
  },180);
  isFlipped=!isFlipped;
  updatePill();
}

function handlePhotoClick(){document.getElementById('photoInput').click();}
document.getElementById('photoInput').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    photoData=e.target.result;
    document.getElementById('uploadedImg').src=photoData;
    document.getElementById('uploadedImg').style.display='block';
    document.getElementById('photoHint').style.display='none';
    // Auto flip to back to write
    if(!isFlipped){setTimeout(()=>flipCard(),350);}
  };
  r.readAsDataURL(f);
});

// Swipe on postcard to flip
(()=>{
  let sx=0;
  document.getElementById('pcScene').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  document.getElementById('pcScene').addEventListener('touchend',e=>{
    if(Math.abs(e.changedTouches[0].clientX-sx)>50)flipCard();
  },{passive:true});
})();

document.getElementById('msgArea').addEventListener('input',function(){document.getElementById('cc').textContent=this.value.length;});

function openDrop(){
  const di=document.getElementById('dragImg'),dn=document.getElementById('dragNoPhoto');
  if(photoData){di.src=photoData;di.style.display='block';dn.style.display='none';}
  else{di.style.display='none';dn.style.display='flex';}
  const addr=document.getElementById('toName').value;
  document.getElementById('cardAddr').textContent=addr||'';
  // Reset card position
  const card=document.getElementById('dragCard');
  card.style.cssText='';card.style.display='';
  go('screen-drop');
  initDrag();
}

function initDrag(){
  const card=document.getElementById('dragCard');
  const box=document.getElementById('dropBox');
  const flap=document.getElementById('dropFlap');
  const hint=document.getElementById('dropHint');
  let ox=0,oy=0,isDragging=false,dropped=false;
  flap.style.transform='';box.classList.remove('glow');hint.classList.remove('near');

  function ptOf(e){return e.touches?e.touches[0]:e;}
  function slotRect(){return document.getElementById('slotHit').getBoundingClientRect();}
  function cardCenter(){const r=card.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
  function nearSlot(){
    const s=slotRect(),c=cardCenter();
    return c.y>s.top-50&&c.y<s.bottom+70&&c.x>s.left-70&&c.x<s.right+70;
  }

  card.onmousedown=card.ontouchstart=function(e){
    if(dropped)return;
    e.preventDefault();
    isDragging=true;card.classList.add('dragging');
    const pt=ptOf(e),r=card.getBoundingClientRect();
    ox=pt.clientX-r.left-r.width/2;
    oy=pt.clientY-r.top-r.height/2;
  };
  document.onmousemove=document.ontouchmove=function(e){
    if(!isDragging||dropped)return;
    e.preventDefault();
    const pt=ptOf(e);
    card.style.position='fixed';
    card.style.left=(pt.clientX-ox-card.offsetWidth/2)+'px';
    card.style.top=(pt.clientY-oy-card.offsetHeight/2)+'px';
    card.style.margin='0';card.style.zIndex='100';
    const n=nearSlot();
    box.classList.toggle('glow',n);
    flap.style.transform=n?'scaleY(0.15)':'';
    hint.classList.toggle('near',n);
    hint.innerHTML=n?T[lang].dropNear:T[lang].dropHint;
  };
  document.onmouseup=document.ontouchend=function(){
    if(!isDragging||dropped)return;
    isDragging=false;card.classList.remove('dragging');
    if(nearSlot()){
      dropped=true;
      const s=slotRect();
      card.style.transition='all .45s cubic-bezier(.4,0,.8,.6)';
      card.style.left=(s.left+s.width/2-card.offsetWidth/2)+'px';
      card.style.top=(s.top-card.offsetHeight/2)+'px';
      card.style.transform='scale(0.1) rotate(-4deg)';
      card.style.opacity='0';
      flap.style.transform='scaleY(1)';
      if(navigator.vibrate)navigator.vibrate([25,15,50]);
      setTimeout(()=>{
        ['left','right','top','right'].forEach((d,i)=>{
          setTimeout(()=>{box.style.transform=`translateX(${i%2?3:-3}px)`;},i*55);
        });
        setTimeout(()=>{box.style.transform='';},220);
      },380);
      setTimeout(()=>{card.style.display='none';go('screen-done');},870);
    } else {
      card.style.transition='all .4s cubic-bezier(.175,.885,.32,1.275)';
      card.style.position='';card.style.left='';card.style.top='';
      card.style.margin='';card.style.zIndex='';
      setTimeout(()=>{card.style.transition='';},400);
      box.classList.remove('glow');flap.style.transform='';
      hint.classList.remove('near');hint.innerHTML=T[lang].dropHint;
    }
  };
}

function reset(){
  document.getElementById('msgArea').value='';
  document.getElementById('cc').textContent='0';
  document.getElementById('toName').value='';document.getElementById('toCity').value='';
  document.getElementById('uploadedImg').style.display='none';document.getElementById('uploadedImg').src='';
  document.getElementById('photoHint').style.display='flex';
  document.getElementById('photoInput').value='';
  photoData=null;isFlipped=false;
